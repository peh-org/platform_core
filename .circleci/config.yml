version: 2.1
orbs:
  terraform: circleci/terraform@3.7.0
jobs:
  validate:
    machine: true
    executor: terraform/default
    steps:
      - checkout
      - run:
          name: tofu fmt
          command: tofu fmt -check -recursive -diff
      - run:
          name: tofu init (no backend)
          command: tofu init -backend=false -input=false
      - run:
          name: tofu validate
          command: tofu validate

